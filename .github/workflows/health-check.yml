name: 源健康巡检

on:
  schedule:
    # 每天 01:00 CST (UTC+8) = 17:00 UTC
    - cron: '0 17 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'master.json'
      - 'adult-master.json'
      - 'decotv-master.json'
      - 'decotv-adult-master.json'
      - 'check_sources.js'
      - 'decotv-check.js'

permissions:
  contents: write

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 运行 KVideo 巡检
        run: node check_sources.js

      - name: 运行 DecoTV 巡检
        run: node decotv-check.js

      - name: 提交结果(有变更才提交)
        run: |
          git config user.name "kvideo-bot"
          git config user.email "kvideo-bot@users.noreply.github.com"
          git add sources.json disabled.json decotv-sources.json decotv-sources.txt decotv-disabled.json report.md
          if ! git diff --cached --quiet; then
            KV=$(python3 -c "import re; print(re.search(r'订阅生效：\*\*\s*(\d+)', open('report.md').read()).group(1))")
            DT=$(python3 -c "import json; print(len(json.load(open('decotv-sources.json'))['api_site']))")
            git commit -m "chore: 自动巡检 $(date -u +%F) - kvideo $KV 源 / decotv $DT 源生效"
            git push
            echo "✅ 已提交巡检结果"
          else
            echo "ℹ️ 无变更"
          fi
